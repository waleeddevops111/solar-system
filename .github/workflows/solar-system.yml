name: Workflows implementaion
on:
    workflow_dispatch: 
    push: 
        branches:
         - main
         - 'feature/*'
env: 

    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
    MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}

jobs:
    unit-testing:
        name: Unit testing
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017
        env: 

         MONGO_URI: 'mongodb://localhost:27017/superData'
         MONGO_USERNAME: non-prod-user
         MONGO_PASSWORD: non-prod-password
        strategy:
            matrix:
                node-version: [18, 20]
                os: [ubuntu-latest]
                #exclude:
                    #- node-version: 18
                      #os: macos-latest 

        runs-on: ${{matrix.os}}
        steps:
        - name: Checkout repository using action
          uses: actions/checkout@v4
        - name: Set up node js env
          uses: actions/setup-node@v4
          with: 
           node-version: ${{matrix.node-version}}
        - name: Cache NPM Dependencies
          id: cache-npm
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{ runner.os }}-node_modules-${{hashFiles('package-lock.json')}}
        - name: install dependencies
          run: npm install
        - name: Run test
          id: nodejs-unit-testing-step
          run: npm test
        - name: test results file using artifact
          if: always()
          uses: actions/upload-artifact@v4
          with:
           name: new-test-results
           path: new-test-results.xml

    coverage:
        name: Code Coverage
        container: 
          image: node:18
        services:
            mongo-db:
              image: siddharth67/mongo-db:non-prod
              options:
                --name mongo
        env: 
            MONGO_URI: 'mongodb://mongo:27017/superData'
            MONGO_USERNAME: non-prod-user
            MONGO_PASSWORD: non-prod-password
        runs-on: ubuntu-latest
        steps:
          - name: checkout rep
            uses: actions/checkout@v4
          # - name: Set up node js environment
          #   uses: actions/setup-node@v4
          - name: Cache NPM Dependencies
            id: cache-npm
            uses: actions/cache@v4
            with:
              path: node_modules
              key: ${{ runner.os }}-node_modules-${{hashFiles('package-lock.json')}}
          - name: install dependencies
            run: npm install
          - name: check code coverage
            continue-on-error: true
            run: npm run coverage
          - name: coverage results
            uses: actions/upload-artifact@v4
            with:
              name: code-coverage-results
              path: coverage
              retention-days: 3
    docker:
     
        name: Docker Job Reusable
        needs: [unit-testing, coverage]
        uses: ./.github/workflows/resusable-workflow.yml
        with:
          image-name: solar-system
          docker-context: .
        secrets:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          
    

    dev-deploy:
      needs: docker
      runs-on: ubuntu-latest
      steps:
        - name: checkout repo  
          uses: actions/checkout@v4
        - name: setup kubectl cli 
          uses: azure/setup-kubectl@v4
          with:
           version: 'v1.26.0' 
        - name: Fetch kubernetes cluster details
          run: |
            kubectl version --short
            echo -------------------------
            kubectl get nodes
            





          